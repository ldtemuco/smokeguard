<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SensoVision | Sistema</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">SensoVision</div>
        <nav class="nav">
            <a href="/dashboard">Dashboard</a>
            <a href="/network">Red</a>
            <a class="active" href="/system">Sistema</a>
            <a class="logout" href="/logout">Salir</a>
        </nav>
    </aside>
    <main>
        <header class="page-head">
            <div><h1>Sistema</h1><div class="muted">Seguridad y mantenimiento.</div></div>
        </header>

        <section class="card section">
            <h2>Cambiar contraseña del panel</h2>
            <form id="password-form" class="form-grid">
                <label>Contraseña actual<input name="current_password" type="password" required></label>
                <label>Nueva contraseña<input name="new_password" type="password" minlength="8" required></label>
                <label>Repetir nueva contraseña<input name="repeat_password" type="password" minlength="8" required></label>
                <div><button class="btn" type="submit">Cambiar contraseña</button></div>
                <div id="password-message"></div>
            </form>
        </section>

        <section class="card section">
            <h2>Mantenimiento</h2>
            <div class="actions">
                <button id="restart" class="btn secondary" type="button">Reiniciar dispositivo</button>
                <button id="factory-reset" class="btn danger" type="button">Restaurar configuración</button>
            </div>
            <p class="muted">Restaurar configuración elimina la red Wi-Fi guardada y devuelve la contraseña del panel al valor inicial.</p>
        </section>
    </main>
</div>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/system.js"></script>
</body>
</html>
